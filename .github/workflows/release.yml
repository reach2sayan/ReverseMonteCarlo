# RMC_run and libRMC.so, built with GCC 15 and Clang 20, as self-contained
# Linux tarballs attached to a GitHub Release, plus an MSVC-built RMC_run.exe as
# a Windows zip. A tag `vX.Y.Z` builds and
# publishes -- pushed by hand, or cut on Mondays by weekly-release.yml; a
# workflow_dispatch run on a branch builds the same tarballs, leaves them on the
# run page and publishes nothing, which is how a change to this pipeline is
# tried before a version rides on it.
#
# The build is CI's: same dependencies, same Boost cache, same flags (MKL, LTO
# and native-arch off), minus tests, examples and mcsqs. ENABLE_NATIVE_ARCH=OFF
# means -march=x86-64-v3, so the binaries need an AVX2 CPU; building on
# ubuntu-24.04 means they need glibc 2.39 or newer.
#
# The same tag also builds the Python wheels (cibuildwheel, manylinux_2_28 and
# win_amd64, CPython 3.11-3.14) and an sdist. Binaries live on GitHub, Python on PyPI: the
# GitHub Release carries only the RMC_run tarballs, and the wheels and sdist go
# to PyPI as reverse-monte-carlo by Trusted Publishing: the `pypi`
# job's OIDC token is exchanged for a one-off upload credential against the
# publisher registered for this repository, this workflow file and the `pypi`
# environment (deployable from v* tags only). No API token is stored anywhere.
# A workflow_dispatch run builds and checks the wheels and uploads nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # First and cheap: a tag that does not name the CMake version stops here.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(sed -nE 's/^project\(ReverseMonteCarlo VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          [[ -n "$version" ]] || { echo "::error::no project(ReverseMonteCarlo VERSION ...) in CMakeLists.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CMakeLists.txt says $version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not name CMakeLists.txt's version $version"
            exit 1
          fi

  native:
    name: ${{ matrix.compiler }} (linux-x86_64)
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-15
            cxx: g++-15
          - compiler: clang
            cc: clang-20
            cxx: clang++-20
    env:
      ARCHIVE: ReverseMonteCarlo-${{ needs.version.outputs.version }}-linux-x86_64-${{ matrix.compiler }}.tar.gz
    steps:
      - uses: actions/checkout@v4

      # seitz transcribes its data tables at configure time with Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # seitz needs GCC 15 (<generator>, std::from_range); clang uses its libstdc++.
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            libspdlog-dev libtbb-dev \
            g++-15
          pip install numpy pandas pygments

      - name: Install clang 20
        if: matrix.compiler == 'clang'
        run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20

      # Same key as ci.yml, so a release reuses the Boost CI already built.
      - name: Cache Boost 1.89
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ~/boost
          key: boost-1.89.0-fullheaders-graph-nowide-${{ matrix.cxx }}

      - name: Build Boost 1.89
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: bash tools/build_boost.sh "$HOME/boost" ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} ${{ matrix.cxx }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-${{ matrix.compiler }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DBOOST_ROOT="$HOME/boost"
          -DPython_EXECUTABLE=${{ env.pythonLocation }}/bin/python
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_MKL=OFF
          -DENABLE_LTO=OFF
          -DENABLE_NATIVE_ARCH=OFF
          -DRMC_BUILD_TESTS=OFF
          -DRMC_BUILD_EXAMPLES=OFF
          -DRMC_BUILD_MCSQS=OFF

      - name: Build
        run: cmake --build build --target RMC_run --parallel

      # The `runtime` component is RMC_run, libRMC.so and their bundled
      # dependencies -- not seitz's headers or CMake package.
      - name: Stage and pack
        run: |
          cmake --install build --component runtime --prefix stage
          ls -lR stage
          mkdir -p dist
          tar czf "dist/$ARCHIVE" -C stage .

      # The assertion that the tarball is self-contained: a stock image with no
      # Boost, TBB or spdlog, and only GCC 14's libstdc++.
      - name: Runs on a stock Ubuntu 24.04
        run: docker run --rm -v "$PWD/stage:/rmc:ro" ubuntu:24.04 /rmc/bin/RMC_run --help

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.compiler }}
          path: dist/*

  # RMC_run.exe as a zip. Its own job, not a leg of the matrix above: every step
  # of that one is bash -- tar, the docker smoke test, $HOME/boost. Boost, oneTBB
  # and Catch2 come from CMakeLists.txt's fetch fallback, so nothing is installed
  # on the runner. The artifact name matches native-* so `publish` picks it up
  # with no change.
  native-windows:
    name: msvc (windows-x86_64)
    needs: version
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      ARCHIVE: ReverseMonteCarlo-${{ needs.version.outputs.version }}-windows-x86_64-msvc.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pygments

      # The same vcvars64.bat hand-off ci.yml documents.
      - name: Set up MSVC (x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $root) { throw "no Visual Studio with the C++ toolset found" }
          $vcvars = Join-Path $root 'VC\Auxiliary\Build\vcvars64.bat'
          $env_after = & "$env:COMSPEC" /s /c "`"$vcvars`" && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }
          foreach ($line in $env_after) {
            if ($line -notmatch '^([^=\s]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ([Environment]::GetEnvironmentVariable($name) -eq $value) { continue }
            [Environment]::SetEnvironmentVariable($name, $value)
            "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "cl.exe is not on PATH after vcvars64.bat" }
          Write-Host "cl.exe: $($cl.Source)"

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          variant: sccache
          key: release-msvc
          max-size: 500M

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: C:/d
          key: deps-msvc-release-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-msvc-release-

      # The same flags as the Linux legs, minus what has no MSVC meaning.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR=C:/d
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DPython_EXECUTABLE=${{ env.pythonLocation }}\python.exe
          -DENABLE_MKL=OFF
          -DENABLE_LTO=OFF
          -DENABLE_NATIVE_ARCH=OFF
          -DRMC_BUILD_TESTS=OFF
          -DRMC_BUILD_EXAMPLES=OFF
          -DRMC_BUILD_MCSQS=OFF

      - name: Build
        run: cmake --build build --target RMC_run --parallel

      # bin/ holds the exe, tbb12.dll and the MSVC runtime; RMC and seitz are
      # static archives on Windows, so nothing of them is installed.
      - name: Stage and pack
        shell: pwsh
        run: |
          cmake --install build --component runtime --prefix stage
          Get-ChildItem -Recurse stage | Select-Object FullName, Length
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path stage/bin/* -DestinationPath "dist/$env:ARCHIVE"

      # The analogue of the Linux docker check. dumpbin is the assertion that
      # matters: a runner with the VC redistributable installed would run the exe
      # happily even if msvcp140.dll had not been staged.
      - name: Self-contained
        shell: pwsh
        run: |
          & stage/bin/RMC_run.exe --help
          $staged = (Get-ChildItem stage/bin -Filter *.dll).Name
          Write-Host "staged DLLs: $($staged -join ', ')"
          $needed = (dumpbin /dependents stage/bin/RMC_run.exe |
            Select-String -Pattern '^\s{4}(\S+\.dll)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value })
          Write-Host "imports: $($needed -join ', ')"
          $missing = $needed | Where-Object {
            $_ -notin $staged -and $_ -notmatch '^(?i)(KERNEL32|USER32|ADVAPI32|SHELL32|ole32|OLEAUT32|WS2_32|dbghelp|bcrypt|api-ms-|ext-ms-)' }
          if ($missing) { throw "not self-contained, missing: $($missing -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: native-msvc
          path: dist/*

  # The Python wheels. RMC_CACHE_DIR lives outside the checkout, under /host:
  # cibuildwheel tar-copies the checkout into the container and copies only the
  # wheelhouse back out. Two caches: the dependency tree (FetchContent + the
  # Boost/oneTBB prefix) keyed exactly, saved only on a miss; ccache rolling.
  wheels-linux:
    name: wheels (manylinux_2_28 x86_64)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore the dependency tree
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/rmc-cache/fc
            ${{ runner.temp }}/rmc-cache/prefix
          key: wheels-deps-manylinux_2_28-${{ hashFiles('CMakeLists.txt', 'tools/build_boost.sh', 'tools/wheel_deps.sh') }}

      - name: Restore the compiler cache
        id: cc
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rmc-cache/ccache
          key: wheels-ccache-manylinux_2_28-${{ github.run_id }}
          restore-keys: wheels-ccache-manylinux_2_28-

      # v4.2.1, not 3.x: 3.4.1's manylinux_2_28 image (2026.03.20) ships
      # patchelf 0.17.2, whose rewrite of the bundled libtbb during auditwheel
      # repair leaves its init code zeroed -- `import rmc` segfaulted in
      # ld.so. 4.2.1's image (2026.09.05) ships patchelf 0.19.1; this exact
      # version and pyproject.toml were run locally for cp311-cp314.
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          RMC_CACHE_DIR: /host${{ runner.temp }}/rmc-cache

      # The container wrote through /host as root; actions/cache tars as the
      # runner user.
      - name: Reclaim the cache directory
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/rmc-cache" || true

      # A shell test, not hashFiles(): hashFiles only sees GITHUB_WORKSPACE.
      - name: Did the dependency tree complete?
        if: always()
        id: deps-state
        run: |
          if compgen -G "$RUNNER_TEMP/rmc-cache/prefix/.boost-*" >/dev/null && compgen -G "$RUNNER_TEMP/rmc-cache/prefix/.tbb-*" >/dev/null; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the dependency tree
        if: always() && steps.deps.outputs.cache-hit != 'true' && steps.deps-state.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/rmc-cache/fc
            ${{ runner.temp }}/rmc-cache/prefix
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rmc-cache/ccache
          key: ${{ steps.cc.outputs.cache-primary-key }}

      # Shared with the Windows job, so the two cannot drift apart.
      - name: Check the wheels
        run: python tools/check_wheels.py "wheelhouse/*.whl"

      # Stricter than the in-container import test: the image's LD_LIBRARY_PATH
      # reaches gcc-toolset-14's newer libstdc++, a user's stock system does not.
      - name: The wheels need nothing newer than the manylinux_2_28 baseline
        run: |
          python3 -m pip install --quiet auditwheel
          for w in wheelhouse/*.whl; do
            echo "=== $w"
            python3 -m auditwheel show "$w"
            rm -rf /tmp/unpack && python3 -m zipfile -e "$w" /tmp/unpack
            nm -D --undefined-only /tmp/unpack/rmc/_core*.so \
              | grep -oE 'GLIBCXX_[0-9.]+|CXXABI_[0-9.]+|GLIBC_[0-9.]+' \
              | sort -uV | tee /tmp/vers
            if grep -qE 'GLIBCXX_3\.4\.(2[5-9]|[3-9][0-9])' /tmp/vers; then
              echo "::error::$w requires a post-3.4.24 GLIBCXX; see the wheels comment in pyproject.toml"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*.whl

  # The Windows wheels. No container and no /host: cibuildwheel runs in-process
  # here, so it inherits the vcvars environment from GITHUB_ENV and the caches
  # live directly on the runner filesystem.
  wheels-windows:
    name: wheels (win_amd64)
    needs: version
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pyproject.toml forces the Ninja generator (MSBuild would compile seitz's
      # tables serially, past the job limit), and Ninja needs this environment.
      - name: Set up MSVC (x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $root) { throw "no Visual Studio with the C++ toolset found" }
          $vcvars = Join-Path $root 'VC\Auxiliary\Build\vcvars64.bat'
          $env_after = & "$env:COMSPEC" /s /c "`"$vcvars`" && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }
          foreach ($line in $env_after) {
            if ($line -notmatch '^([^=\s]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ([Environment]::GetEnvironmentVariable($name) -eq $value) { continue }
            [Environment]::SetEnvironmentVariable($name, $value)
            "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "cl.exe is not on PATH after vcvars64.bat" }
          Write-Host "cl.exe: $($cl.Source)"

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          variant: sccache
          key: wheels-msvc
          max-size: 2G

      # C:/d for MAX_PATH, as pyproject.toml's windows table explains. Keyed on
      # CMakeLists.txt because that file decides what gets fetched.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: C:/d
          key: wheels-fc-win-amd64-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: wheels-fc-win-amd64-

      # Required, not incidental: pyproject.toml asks for build-frontend
      # "build[uv]", and on Windows cibuildwheel creates each build venv itself
      # with `uv venv`, locating the binary in its own environment or on PATH.
      # The action installs plain cibuildwheel without the uv extra, so without
      # this step setup_python dies on `assert uv_path is not None` before a
      # single wheel is built. Linux needs no equivalent: the manylinux container
      # ships its own uv.
      - uses: astral-sh/setup-uv@v7

      - uses: pypa/cibuildwheel@v4.2.1
        env:
          # Appended to the pyproject line through its $CMAKE_ARGS expansion.
          CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: sccache statistics
        if: always()
        run: sccache --show-stats

      # The same script the Linux job runs. No nm -D gate here: the glibc
      # baseline it protects is a Linux concern, and delvewheel has already
      # vendored what the extension needs.
      - name: Check the wheels
        run: python tools/check_wheels.py "wheelhouse/*.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl

  # `pipx run build`, not `uv build`: pyproject.toml sets [tool.uv]
  # package = false, which uv overrides for an explicit build (astral-sh/uv#12352).
  sdist:
    name: sdist
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Only on a tag. A workflow_dispatch run stops before this, which is what
  # makes a dispatch a rehearsal.
  publish:
    if: github.ref_type == 'tag'
    needs: [version, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The RMC_run tarballs only; the wheels and sdist go to PyPI.
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  # Trusted Publishing: no token. Only the wheels and the sdist are downloaded,
  # so the RMC_run tarballs never reach the upload.
  pypi:
    name: PyPI
    if: github.ref_type == 'tag'
    needs: [version, wheels-linux, wheels-windows, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/reverse-monte-carlo/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      # pattern, not an exact name: there is one wheels artifact per platform,
      # and an exact `name: wheels-linux` would silently drop the Windows wheels
      # from the upload.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
