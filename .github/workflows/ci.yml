name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI keeps builds portable and fast: MKL off, native-arch off, LTO off.
# Real optimised builds use the CMake presets (release / relwithdebinfo).
jobs:
  linux:
    name: ${{ matrix.compiler }} (Linux)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-15
            cxx: g++-15
          - compiler: clang
            cc: clang-20
            cxx: clang++-20

    steps:
      - uses: actions/checkout@v4

      # seitz transcribes its data tables at configure time with Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # seitz needs GCC 15 (<generator>, std::from_range); clang uses its libstdc++.
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            libspdlog-dev libtbb-dev catch2 \
            g++-15
          pip install numpy pandas pygments

      - name: Install clang 20
        if: matrix.compiler == 'clang'
        run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20

      # ubuntu-24.04's libboost-all-dev is 1.83, which lacks Boost.Parser
      # (1.87+) and Boost.Process v2's compiled library (1.86+). Build the
      # handful of compiled Boost libs we need from the 1.89 source release,
      # matching the local /opt/boost toolchain, and cache the install tree.
      - name: Cache Boost 1.89
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ~/boost
          key: boost-1.89.0-fullheaders-graph-nowide-${{ matrix.cxx }}

      - name: Build Boost 1.89
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver=1.89.0
          us=${ver//./_}
          curl -fsSL "https://archives.boost.io/release/${ver}/source/boost_${us}.tar.bz2" \
            -o boost.tar.bz2
          tar xf boost.tar.bz2
          cd "boost_${us}"
          toolset=${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          echo "using ${toolset} : : ${{ matrix.cxx }} ;" > "${HOME}/user-config.jam"
          ./bootstrap.sh \
            --with-libraries=program_options,serialization,container,context,filesystem,process,graph,nowide
          ./b2 -j"$(nproc)" \
            toolset=${toolset} cxxstd=23 variant=release link=shared \
            --user-config="${HOME}/user-config.jam" \
            --prefix="${HOME}/boost" install
          # `b2 install` only copies headers for the --with libraries (and their
          # scanned deps), which misses header-only modules we use (Boost.Parser)
          # and the Process v2 umbrella header. The release tarball already ships
          # the complete real header tree, so install it wholesale.
          cp -af boost "${HOME}/boost/include/"

      # Eigen 5 is fetched from source by CMake (FetchContent) — no system pkg.

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ matrix.compiler }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DBOOST_ROOT=$HOME/boost
          -DPython_EXECUTABLE=${{ env.pythonLocation }}/bin/python
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_MKL=OFF
          -DENABLE_LTO=OFF
          -DENABLE_NATIVE_ARCH=OFF
          -DRMC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          export LD_LIBRARY_PATH="$HOME/boost/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build --output-on-failure
